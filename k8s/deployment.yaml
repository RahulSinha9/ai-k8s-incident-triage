apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-k8s-incident-triage
  namespace: ai-k8s-triage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-k8s-incident-triage
  template:
    metadata:
      labels:
        app: ai-k8s-incident-triage
    spec:
      serviceAccountName: ai-k8s-incident-triage
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/rahulsinha9/ai-k8s-incident-triage:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-k8s-incident-triage
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ai-k8s-incident-triage
  namespace: ai-k8s-triage
spec:
  selector:
    app: ai-k8s-incident-triage
  ports:
    - name: http
      port: 8000
      targetPort: 8000
